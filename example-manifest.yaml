apiVersion: batch/v1
kind: CronJob
metadata:
  name: isplexuptodate
  namespace: monitoring
spec:
  schedule: "0 8 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: isplexuptodate
            image: ghcr.io/mainmain-rl/isplexuptodate:latest
            env:
            - name: PLEX_URL
              value: "http://plex.media.svc.cluster.local:32400"
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: isplexuptodate_discord_webhook-secret
                  key: webhook
